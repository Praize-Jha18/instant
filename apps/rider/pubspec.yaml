name: instant_rider
description: "Instant rider app: vendor riders accept, pick up and deliver orders."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Shared workspace packages
  core_models:
    path: ../../packages/core_models
  api_client:
    path: ../../packages/api_client
  local_db:
    path: ../../packages/local_db
  design_system:
    path: ../../packages/design_system

  # State, navigation, storage
  # NOTE: riverpod_annotation/riverpod_generator are intentionally absent. No
  # riverpod_generator release resolves alongside objectbox_generator ^5.3
  # (analyzer <11) and json_serializable ^6.14 (dart_style/source_gen ^4), which
  # the shared packages pin. Providers are hand-written Riverpod 3 classes.
  flutter_riverpod: ^3.0.0
  go_router: ">=16.0.0 <19.0.0"
  flutter_secure_storage: ">=9.2.4 <12.0.0"

  # Maps, location, media, links
  google_maps_flutter: ^2.10.0
  geolocator: ^14.0.0
  image_picker: ^1.2.0
  url_launcher: ^6.3.1

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
