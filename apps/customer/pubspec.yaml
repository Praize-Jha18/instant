name: instant_customer
description: "Instant customer app: browse vendors, order, pay and track deliveries."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # Shared workspace packages
  core_models:
    path: ../../packages/core_models
  api_client:
    path: ../../packages/api_client
  local_db:
    path: ../../packages/local_db
  design_system:
    path: ../../packages/design_system

  # State + navigation
  flutter_riverpod: ^3.0.0
  go_router: '>=16.0.0 <19.0.0'

  # Platform
  flutter_secure_storage: '>=9.2.4 <12.0.0'
  flutter_stripe: ^14.0.0
  google_maps_flutter: ^2.12.0
  geolocator: '>=12.0.0 <15.0.0'
  shared_preferences: ^2.5.2
  url_launcher: ^6.3.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
