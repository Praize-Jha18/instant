name: instant_vendor
description: Instant vendor and platform admin app (Android, iOS, Web).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  core_models:
    path: ../../packages/core_models
  api_client:
    path: ../../packages/api_client
  local_db:
    path: ../../packages/local_db
  design_system:
    path: ../../packages/design_system
  instant_customer:
    path: ../customer
  instant_rider:
    path: ../rider

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.0
  go_router: ^18.0.0
  flutter_secure_storage: ^11.0.0
  image_picker: ^1.2.0
  google_maps_flutter: ^2.18.0
  google_maps_flutter_web: ^0.6.3
  intl: ^0.20.2
  uuid: ^4.5.0
  fl_chart: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
