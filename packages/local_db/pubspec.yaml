name: local_db
description: LocalStore interface with ObjectBox and in-memory implementations, outbox and SyncEngine for the Instant apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  api_client:
    path: ../api_client
  connectivity_plus: ^6.1.0
  core_models:
    path: ../core_models
  meta: ^1.16.0
  objectbox: ^5.3.0
  objectbox_flutter_libs: ^5.3.0
  path: ^1.9.0
  path_provider: ^2.1.5
  uuid: ^4.5.0

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  objectbox_generator: ^5.3.0
